<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>web apps · inder</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      --pointer-x: 50vw;
      --pointer-y: 50vh;
      --pointer-grid-opacity: 0;
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background-color: #0f0f12;
      background-image: radial-gradient(circle, rgba(215, 249, 6, 0.15) 1px, transparent 1.2px);
      background-size: 40px 40px;
      background-position: center;
      color: #e4e4e7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      isolation: isolate;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(215, 249, 6, 0.72) 1px, transparent 1.2px);
      background-size: 40px 40px;
      background-position: center;
      -webkit-mask-image: radial-gradient(circle 150px at var(--pointer-x) var(--pointer-y), #000 0%, rgba(0, 0, 0, 0.85) 35%, transparent 100%);
      mask-image: radial-gradient(circle 150px at var(--pointer-x) var(--pointer-y), #000 0%, rgba(0, 0, 0, 0.85) 35%, transparent 100%);
      opacity: var(--pointer-grid-opacity);
      transition: opacity 0.18s ease;
    }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
      color: #D7F906;
    }
    .tagline {
      font-size: 0.95rem;
      color: #a1a1aa;
      margin: 0 0 2rem;
    }
    nav {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: #18181c;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      color: #e4e4e7;
      text-decoration: none;
      font-weight: 600;
      text-align: left;
      transition: border-color 0.2s, background 0.2s;
    }
    a:hover {
      border-color: #D7F906;
      background: #1c1c20;
    }
    a .card-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #0f0f12;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    a:hover .card-icon {
      background: #D7F906;
      box-shadow: 0 0 0 1px rgba(215, 249, 6, 0.8), 0 6px 14px rgba(0, 0, 0, 0.6);
    }
    a .card-icon img {
      width: 24px;
      height: 24px;
      display: block;
      filter: brightness(0) invert(1);
    }
    a:hover .card-icon img {
      filter: brightness(0);
    }
    a .card-text {
      min-width: 0;
    }
    a span {
      display: block;
      font-size: 0.8125rem;
      font-weight: 400;
      color: #a1a1aa;
      margin-top: 0.2rem;
    }
    .footer {
      margin-top: 2.5rem;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.875rem;
      color: #a1a1aa;
    }
    .footer .cursor-blink {
      display: inline-block;
      width: 0.6ch;
      text-align: left;
      color: #D7F906;
      animation: cursor-blink 1s steps(2, start) infinite;
    }
    @keyframes cursor-blink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0;
      }
    }
    @media (hover: none), (prefers-reduced-motion: reduce) {
      body::before {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>&gt;_ web apps</h1>
    <p class="tagline"></p>
    <nav>
      <a href="https://inderstudio.github.io/unix-timestamp-converter/" target="_blank" rel="noopener noreferrer">
        <span class="card-icon">
          <img src="https://inderstudio.github.io/unix-timestamp-converter/favicon.svg" alt="" width="24" height="24">
        </span>
        <span class="card-text">
          Unix Timestamp Converter
          <span>Convert between Unix time and human-readable · date & time</span>
        </span>
      </a>
      <a href="https://inderstudio.github.io/QR-Creator/" target="_blank" rel="noopener noreferrer">
        <span class="card-icon">
          <img src="https://inderstudio.github.io/QR-Creator/favicon.svg" alt="" width="24" height="24">
        </span>
        <span class="card-text">
          QR Creator
          <span>Styled QR codes with logo and caption · PNG, JPEG, SVG</span>
        </span>
      </a>
      <a href="https://inderstudio.github.io/XL-Formula/" target="_blank" rel="noopener noreferrer">
        <span class="card-icon">
          <img src="https://inderstudio.github.io/XL-Formula/favicon.svg" alt="" width="24" height="24">
        </span>
        <span class="card-text">
          XL Formula Generator
          <span>Build XLOOKUP, FILTER, IF formulas · copy to clipboard</span>
        </span>
      </a>
    </nav>
    <footer class="footer">&gt;<span class="cursor-blink">_</span> inder</footer>
  </div>
  <script>
    const canUsePointerGrid = window.matchMedia('(hover: hover) and (prefers-reduced-motion: no-preference)').matches;

    if (canUsePointerGrid) {
      let pointerFrame = 0;
      let pointerX = 0;
      let pointerY = 0;

      document.addEventListener('pointermove', function (event) {
        pointerX = event.clientX;
        pointerY = event.clientY;

        if (pointerFrame) return;

        pointerFrame = requestAnimationFrame(function () {
          document.body.style.setProperty('--pointer-x', pointerX + 'px');
          document.body.style.setProperty('--pointer-y', pointerY + 'px');
          document.body.style.setProperty('--pointer-grid-opacity', '1');
          pointerFrame = 0;
        });
      });

      document.documentElement.addEventListener('mouseleave', function () {
        document.body.style.setProperty('--pointer-grid-opacity', '0');
      });
    }

    document.querySelectorAll('nav a[href^="http"]').forEach(function (a) {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
      a.addEventListener('click', function (e) {
        e.preventDefault();
        window.open(a.getAttribute('href'), '_blank', 'noopener,noreferrer');
      });
    });
  </script>
</body>
</html>
